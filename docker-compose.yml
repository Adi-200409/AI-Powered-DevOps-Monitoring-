name: devops-monitoring

version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-devops_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Monitored Sample Application (FastAPI + Python)
  # -------------------------------------------------------------
  application:
    build:
      context: .
      dockerfile: application/Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - APP_PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-devops_db}
      - LOG_FILE_PATH=/app/logs/application.log
    volumes:
      - shared-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devops-network

  # -------------------------------------------------------------
  # 3. Python Monitoring Service (Log tailer + Groq + Slack)
  # -------------------------------------------------------------
  monitoring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-monitor
    restart: unless-stopped
    command: ["python", "-m", "monitoring.main"]
    env_file:
      - .env.example
    environment:
      - LOG_FILE_PATH=/workspace/logs/application.log
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - shared-logs:/workspace/logs
      - .:/workspace
    depends_on:
      - application
    networks:
      - devops-network

  # -------------------------------------------------------------
  # 4. Centralized Web Monitoring Dashboard (FastAPI + React)
  # -------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-dashboard
    restart: unless-stopped
    command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "5050"]
    ports:
      - "5050:5050"
    env_file:
      - .env.example
    environment:
      - DASHBOARD_PORT=5050
      - LOG_FILE_PATH=/workspace/logs/application.log
      - APP_HEALTH_URL=http://application:5000/health
    volumes:
      - shared-logs:/workspace/logs
      - .:/workspace
    depends_on:
      - monitoring
    networks:
      - devops-network

volumes:
  postgres-data:
  shared-logs:

networks:
  devops-network:
    driver: bridge
